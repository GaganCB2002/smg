    <style>

      html { background: #080c16; }
      #boot {

        background: radial-gradient(120% 120% at 50% 30%, #131c31 0%, #080c16 60%, #05070e 100%);
        color: #d9c08a; font-family: 'Cormorant Garamond', Georgia, serif;
        letter-spacing: 0.5em; font-size: 12px; text-transform: uppercase;
        z-index: 9999; transition: opacity .6s ease;
      }
      #boot.done { opacity: 0; pointer-events: none; }
    </style>
